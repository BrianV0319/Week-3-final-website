<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Videos | Basket Training</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-900 antialiased">
  <header class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white">
    <div class="max-w-5xl mx-auto px-6 py-6 flex flex-wrap items-center justify-between gap-4">
      <a href="index.html" class="flex items-center gap-4">
        <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center font-bold">BT</div>
        <div>
          <h1 class="text-2xl font-semibold">Basket Training</h1>
          <p class="text-sm opacity-90">Structured drills to level up your game</p>
        </div>
      </a>
      <nav class="flex flex-wrap gap-2 items-center">
        <a href="index.html" class="px-2 py-1 hover:underline">Home</a>
        <a href="drills.html" class="px-2 py-1 hover:underline">Drills</a>
        <a href="videos.html" class="px-2 py-1 hover:underline font-semibold underline">Videos</a>
        <a href="plans.html" class="px-2 py-1 hover:underline">Plans</a>
        <a href="contact.html" class="px-2 py-1 hover:underline">Contact</a>
      </nav>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-10">
    <h2 class="text-3xl font-bold mb-6">Video Demonstrations</h2>
    <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="card">
        <h3 class="font-semibold mb-2">Shooting Mechanics</h3>
        <div class="video-wrap relative h-64 rounded overflow-hidden bg-gray-300">
          <img src="https://img.youtube.com/vi/xWuO8GF5FIw/hqdefault.jpg" alt="" class="video-thumb locked w-full h-full object-cover" />
          <div class="video-lock absolute inset-0 flex flex-col items-center justify-center text-center text-white bg-black bg-opacity-40 px-4">
            <p class="font-semibold mb-3">Choose a training plan to unlock this video</p>
            <a href="plans.html" class="px-5 py-2 rounded-lg bg-indigo-600 text-white font-semibold">See Plans</a>
          </div>
          <!-- Video ID goes in data-src after /embed/ -->
          <iframe data-src="https://www.youtube.com/embed/xWuO8GF5FIw" title="Shooting Mechanics" class="video-frame hidden w-full h-full" allowfullscreen></iframe>
        </div>
      </div>
      <div class="card">
        <h3 class="font-semibold mb-2">Dribbling Progression</h3>
        <div class="video-wrap relative h-64 rounded overflow-hidden bg-gray-300">
          <img src="https://img.youtube.com/vi/Ap54qviLYSU/hqdefault.jpg" alt="" class="video-thumb locked w-full h-full object-cover" />
          <div class="video-lock absolute inset-0 flex flex-col items-center justify-center text-center text-white bg-black bg-opacity-40 px-4">
            <p class="font-semibold mb-3">Choose a training plan to unlock this video</p>
            <a href="plans.html" class="px-5 py-2 rounded-lg bg-indigo-600 text-white font-semibold">See Plans</a>
          </div>
          <!-- Video ID goes in data-src after /embed/ -->
          <iframe data-src="https://www.youtube.com/embed/Ap54qviLYSU" title="Dribbling Progression" class="video-frame hidden w-full h-full" allowfullscreen></iframe>
        </div>
      </div>
    </section>
  </main>

  <footer class="text-center py-8 text-sm text-gray-600">
    © 2025 Basket Training
  </footer>

  <script src="app.js"></script>
</body>
</html>
